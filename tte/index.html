<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Target Trial Specification">Target Trial Specification</title>
<link rel="stylesheet" href="../shared/style.css?v=20260930a">
<style>
  .comp textarea { min-height: 54px; }
  .comp .cols { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .comp .guide { font-size: 11.5px; color: var(--muted); margin: 2px 0 6px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html" data-en="← Home">← 工具首頁</a>
  <h1>Target Trial Specification</h1>
  <span class="sub" data-en="Protocol table for target trial emulation">目標試驗模擬（TTE）規格表</span>
  <span class="spacer"></span>
  <div class="btns">
    <button class="small" id="btnUndo" title="復原 (Ctrl+Z)" data-en-title="Undo (Ctrl+Z)">↶</button>
    <button class="small" id="btnRedo" title="重做 (Ctrl+Y)" data-en-title="Redo (Ctrl+Y)">↷</button>
    <button class="small" id="btnSaveJson" title="把目前所有輸入與設定下載成 .json 檔，之後可用「開啟設定檔」繼續編輯或分享給共同作者" data-en-title="Download all inputs and settings as a .json file; reopen it later or share it with co-authors" data-en="Save project">儲存設定檔</button>
    <button class="small" id="btnLoadJson" title="開啟先前儲存的 .json 設定檔，還原所有輸入" data-en-title="Open a previously saved .json project file" data-en="Open project">開啟設定檔</button>
    <button class="small" id="btnExample" data-en="Example">範例</button>
    <button class="small" id="btnReset" data-en="Clear">清空</button>
  </div>
</header>

<main class="tool">
  <section id="form">
    <div class="card">
      <p class="hint" style="margin:0" data-en="Specify the protocol of the hypothetical randomised trial you would like to run (the <b>target trial</b>), then how each component is <b>emulated</b> with your observational data. Aligning eligibility, treatment assignment and the start of follow-up at <b>time zero</b> is what prevents immortal-time and selection biases. The table pairs with the study-design timeline (Timeline tool → “Target trial emulation”).">先寫出你理想中要做的隨機試驗（<b>target trial</b>）的研究計畫，再逐項說明如何用觀察性資料<b>模擬</b>。資格、分派與追蹤起點在 <b>time zero</b> 對齊，是避免 immortal time 與選擇偏誤的關鍵。此表可搭配研究設計時間軸（Timeline 工具 →「目標試驗模擬」範本）。</p>
    </div>

    <div class="card">
      <h2><span class="step-no">1</span> <span data-en="Table layout">表格設定</span></h2>
      <label class="field"><span data-en="Table title (optional)">表格標題（選填）</span><input data-k="title"></label>
      <div class="grid2">
        <label class="field"><span data-en="Column 1 header">第 1 欄標題</span><input data-k="h0"></label>
        <label class="field"><span data-en="Column 2 header">第 2 欄標題</span><input data-k="h1"></label>
        <label class="field"><span data-en="Column 3 header">第 3 欄標題</span><input data-k="h2"></label>
        <label class="field" data-show="col4"><span data-en="Column 4 header">第 4 欄標題</span><input data-k="h3"></label>
      </div>
      <label class="check"><input type="checkbox" data-k="col4"> <span data-en="Add a 4th column (e.g. deviations from the target trial / justification)">加第 4 欄（例如：與 target trial 的差異／理由）</span></label>
    </div>

    <div class="card">
      <h2><span class="step-no">2</span> <span data-en="Protocol components">研究計畫要素</span></h2>
      <div id="comps"></div>
      <button class="small" id="addComp" data-en="+ Add component">＋ 新增要素</button>
    </div>

    <div class="card">
      <details>
        <summary><span class="step-no" style="display:inline-grid">3</span> <span data-en="Appearance">外觀：字型、顏色、欄寬</span></summary>
        <div id="styleFields"></div>
        <div class="grid2">
          <label class="field"><span data-en="Table width (px)">表格寬度 (px)</span><input type="number" data-k="tableW" min="500" max="2000" step="10"></label>
          <label class="field"><span data-en="First column width (%)">第 1 欄寬 (%)</span><input type="number" data-k="c0" min="10" max="50" step="1"></label>
          <label class="field"><span data-en="Header fill">標題列底色</span><input type="color" data-k="headFill" style="width:100%"></label>
          <label class="field"><span data-en="First column fill">第 1 欄底色</span><input type="color" data-k="firstFill" style="width:100%"></label>
          <label class="field"><span data-en="Border colour">框線顏色</span><input type="color" data-k="border" style="width:100%"></label>
          <label class="field"><span data-en="Border width (px)">框線粗細 (px)</span><input type="number" data-k="borderW" min="0" max="4" step="0.1"></label>
        </div>
        <label class="check"><input type="checkbox" data-k="zebra"> <span data-en="Zebra rows">斑馬紋列</span></label>
        <label class="check"><input type="checkbox" data-k="landscape"> <span data-en="Word: landscape page">Word：橫向頁面</span></label>
        <label class="field"><span data-en="Footnote (optional)">註腳（選填）</span><textarea data-k="footnote" rows="2"></textarea></label>
      </details>
    </div>
    <div class="card" id="refs"></div>
  </section>

  <section class="preview-col">
    <div class="paper" id="preview"></div>
    <div class="card" id="export"></div>
  </section>
</main>

<script src="../shared/common.js?v=20260930a"></script>
<script>
const T = RT.t;
const KEY = 'tte1';
// guidance written for this tool (not quoted from any guideline)
const COMPONENTS = [
  ['Eligibility criteria', '誰會被納入這個理想試驗？列出納入／排除條件，以及在觀察資料中用哪些紀錄、在哪個回溯期間判定。', 'Who would enter the ideal trial? List inclusion/exclusion criteria and how and over which look-back period they are ascertained in the data.'],
  ['Treatment strategies', '比較哪些處置策略（包含劑量、持續與否、允許的切換）？在資料中如何辨識開始使用。', 'Which treatment strategies are compared (dose, continuation, allowed switching)? How is initiation identified in the data?'],
  ['Assignment procedures', '試驗中為隨機分派；模擬時說明在哪些基準共變項下假設可交換性，以及如何調整（例如 propensity score）。', 'Randomised in the trial; in the emulation, state the baseline covariates under which exchangeability is assumed and how they are adjusted for (e.g. propensity scores).'],
  ['Follow-up period', 'Time zero 是什麼？追蹤何時開始、何時結束（結果、死亡、失去追蹤、行政截止）。資格、分派與追蹤起點應在 time zero 對齊。', 'What is time zero? When does follow-up start and end (outcome, death, loss to follow-up, administrative end)? Eligibility, assignment and start of follow-up should coincide at time zero.'],
  ['Outcome', '主要結果與定義；在資料中用哪些診斷碼／演算法，是否經過驗證。', 'Primary outcome and its definition; codes/algorithms used in the data and whether they are validated.'],
  ['Causal contrasts of interest', '例如 intention-to-treat effect 與 per-protocol effect；模擬時對應的觀察性類比。', 'E.g. intention-to-treat and per-protocol effects, and their observational analogues in the emulation.'],
  ['Statistical analysis', '估計方法（例如加權 Cox 模型）、如何處理偏離策略（censoring + IPCW）、信賴區間、敏感度分析。', 'Estimation (e.g. weighted Cox model), handling of deviations (censoring + IPCW), confidence intervals, sensitivity analyses.'],
];
const comp = (name, g, a = '', b = '', c = '') => ({ name, g, a, b, c });
const DEF = {
  title: 'Table. Specification and emulation of the target trial',
  h0: 'Protocol component', h1: 'Target trial specification', h2: 'Emulation using observational data', h3: 'Deviation from target trial / justification',
  col4: false, comps: COMPONENTS.map(([n], i) => comp(n, i)),
  tableW: 1000, c0: 20, headFill: '#D9D9D9', firstFill: '#F2F2F2', border: '#000000', borderW: 1, zebra: false, landscape: false, footnote: '',
  st: { ...RT.STYLE_DEF, fontSize: 12.5, lh: 1.3, pad: 7 },
};
const EX = [
  ['Adults aged ≥ 40 years with type 2 diabetes; no use of SGLT2 or DPP-4 inhibitors in the previous 365 days; no history of heart failure; ≥ 1 year of continuous enrollment.',
   'Same criteria, assessed with diagnosis codes and dispensing records in the 365 days before time zero.', ''],
  ['Initiate an SGLT2 inhibitor vs initiate a DPP-4 inhibitor, and continue the assigned drug during follow-up.',
   'Same; initiation identified by the first dispensing. Switching or a gap > 30 days in supply defines deviation from the assigned strategy.', ''],
  ['Random assignment to either strategy; open label.',
   'Assignment assumed random conditional on baseline covariates (demographics, comorbidities, co-medications, healthcare use), balanced with propensity-score overlap weighting.', 'Residual confounding possible; assessed with negative-control outcomes.'],
  ['Starts at randomisation (time zero); ends at the outcome, death, loss to follow-up or 5 years, whichever occurs first.',
   'Starts at the first dispensing, when eligibility is met and the strategy is assigned; ends at the outcome, death, disenrollment, 5 years, or end of data (31 Dec 2020).', ''],
  ['Hospitalisation for heart failure.', 'Inpatient admission with a primary heart-failure diagnosis (validated algorithm).', ''],
  ['Intention-to-treat effect; per-protocol effect.', 'Observational analogue of the intention-to-treat effect; per-protocol effect.', ''],
  ['Intention-to-treat: Cox model comparing assigned groups. Per-protocol: censor at deviation and adjust with inverse-probability-of-censoring weights.',
   'Weighted Cox model; per-protocol analysis with censoring at deviation and IPCW; 95% CIs by bootstrap; sensitivity analyses varying the grace period.', ''],
];
let S = RT.load(KEY, DEF);

/* ---------------- form ---------------- */
const form = document.getElementById('form');
document.getElementById('styleFields').innerHTML = RT.styleFieldsHTML(['font', 'fontSize', 'lh', 'textColor', 'pad']);
document.getElementById('refs').innerHTML = RT.refsHTML([RT.REFS.tte, RT.REFS.tteJama, RT.REFS.libs]);
function syncInputs() { RT.syncForm(form, S); renderComps(); }
RT.bindForm(form, () => S, () => { renderComps(true); update(); });
const guideOf = (c) => (Number.isInteger(c.g) && COMPONENTS[c.g] ? T(COMPONENTS[c.g][1], COMPONENTS[c.g][2]) : '');
function renderComps(labelsOnly) {
  const host = document.getElementById('comps');
  if (labelsOnly) {
    host.querySelectorAll('[data-col]').forEach((el) => { el.textContent = S['h' + el.dataset.col]; });
    host.querySelectorAll('.c3').forEach((el) => (el.hidden = !S.col4));
    return;
  }
  host.innerHTML = '';
  S.comps.forEach((c, i) => {
    const blk = RT.h(`<div class="block comp">
      <div class="block-head"><b>${i + 1}.</b><input data-f="name" style="flex:1"><span class="spacer" style="flex:0"></span>
        <button class="small" data-a="up" title="${T('上移', 'Move up')}">↑</button><button class="small" data-a="down" title="${T('下移', 'Move down')}">↓</button>
        <button class="icon" data-a="del" title="${T('刪除', 'Delete')}">✕</button></div>
      <div class="guide">${RT.esc(guideOf(c))}</div>
      <div class="cols">
        <label><span class="lbl" data-col="1"></span><textarea data-f="a" rows="2"></textarea></label>
        <label><span class="lbl" data-col="2"></span><textarea data-f="b" rows="2"></textarea></label>
        <label class="c3"><span class="lbl" data-col="3"></span><textarea data-f="c" rows="2"></textarea></label>
      </div></div>`);
    blk.querySelectorAll('[data-col]').forEach((el) => (el.textContent = S['h' + el.dataset.col]));
    blk.querySelector('.c3').hidden = !S.col4;
    blk.querySelectorAll('[data-f]').forEach((el) => {
      el.value = c[el.dataset.f] ?? '';
      el.oninput = () => { c[el.dataset.f] = el.value; update(); };
    });
    blk.querySelector('.block-head').onclick = (e) => {
      const a = e.target.dataset.a;
      if (a === 'up' && i > 0) [S.comps[i - 1], S.comps[i]] = [S.comps[i], S.comps[i - 1]];
      else if (a === 'down' && i < S.comps.length - 1) [S.comps[i + 1], S.comps[i]] = [S.comps[i], S.comps[i + 1]];
      else if (a === 'del') S.comps.splice(i, 1);
      else return;
      renderComps(); update();
    };
    host.appendChild(blk);
  });
}
document.getElementById('addComp').onclick = () => { S.comps.push(comp('', null)); renderComps(); update(); };

/* ---------------- table figure ---------------- */
function tableModel() {
  const heads = [S.h0, S.h1, S.h2].concat(S.col4 ? [S.h3] : []);
  const rows = S.comps.map((c) => [c.name, c.a, c.b].concat(S.col4 ? [c.c] : []));
  const c0 = Math.max(10, Math.min(50, Number(S.c0) || 20));
  const rest = S.col4 ? [(100 - c0) * 0.36, (100 - c0) * 0.36, (100 - c0) * 0.28] : [(100 - c0) / 2, (100 - c0) / 2];
  return { heads, rows, widths: [c0, ...rest] };
}
function build() {
  const st = RT.applyStyle(S.st);
  const fs = Number(st.fontSize) || 12.5, M = 16, W = Number(S.tableW) || 1000;
  const { heads, rows, widths } = tableModel();
  const tw = W - 2 * M, cw = widths.map((p) => (tw * p) / 100);
  const bw = Number(S.borderW) || 0;
  const o = { size: fs, lh: Number(st.lh) || 1.3, pad: Number(st.pad) || 7, align: 'left', color: st.textColor, stroke: bw > 0 ? S.border : 'none', sw: bw, radius: 0 };
  RT.beginScene();
  let body = '', y = M;
  if (S.title && S.title.trim()) {
    const tb = RT.box([{ text: S.title, bold: true }], tw, { ...o, fill: 'none', stroke: 'none', pad: 0, padX: 0, size: fs * 1.08 });
    body += RT.drawBox(tb, M, y); y += tb.h + fs * 0.6;
  }
  const drawRow = (cells, fillOf, boldFirst, boldAll) => {
    const boxes = cells.map((t, i) => RT.box([{ text: String(t ?? ''), bold: boldAll || (boldFirst && i === 0) }], cw[i], { ...o, fill: fillOf(i) }));
    const h = Math.max(...boxes.map((b) => b.h));
    let x = M;
    boxes.forEach((b, i) => { body += RT.drawBox(b, x, y, h); x += cw[i]; });
    y += h;
  };
  drawRow(heads, () => S.headFill, false, true);
  rows.forEach((r, ri) => drawRow(r, (i) => (i === 0 ? S.firstFill : S.zebra && ri % 2 ? '#F7F7F7' : '#FFFFFF'), true, false));
  if (S.footnote && S.footnote.trim()) {
    const fb = RT.box([{ text: S.footnote }], tw, { ...o, fill: 'none', stroke: 'none', pad: 0, padX: 0, size: fs * 0.85 });
    body += RT.drawBox(fb, M, y + fs * 0.5); y += fs * 0.5 + fb.h;
  }
  return RT.figure(W, y + M, body);
}
const docxTable = () => {
  RT.applyStyle(S.st);
  const { heads, rows, widths } = tableModel();
  return RT.buildDocxTable({
    title: S.title, note: S.footnote, headers: heads, widths, landscape: S.landscape || S.col4,
    rows: rows.map((r) => r.map((t, i) => (i === 0 ? { text: t, bold: true, fill: S.firstFill } : { text: t }))),
    sizePt: Math.max(8, Math.min(12, (Number(S.st.fontSize) || 12.5) * 0.8)), headerFill: S.headFill, borderColor: S.border,
  });
};

let fig;
const preview = document.getElementById('preview');
const exporter = RT.exportPanel(document.getElementById('export'), () => fig, 'target_trial_table', {
  docx: docxTable, docxLabel: T('Word 表格（可編輯）', 'Word table (editable)'),
  docxInfo: T('匯出為真正的 Word 表格，可直接編輯文字、欄寬與框線', 'Exports a real Word table — edit text, column widths and borders directly'),
});
const hist = RT.history(() => S, (s) => { S = s; syncInputs(); render(); });
function render() {
  try { fig = build(); preview.innerHTML = fig.svg; }
  catch (e) { console.error(e); preview.innerHTML = `<div class="msg">⚠ ${RT.esc(e.message)}</div>`; }
  exporter.refresh();
  RT.save(KEY, S);
}
const update = RT.debounce(() => { render(); hist.push(); }, 80);

document.getElementById('btnUndo').onclick = hist.undo;
document.getElementById('btnRedo').onclick = hist.redo;
document.getElementById('btnExample').onclick = () => {
  S.comps = COMPONENTS.map(([n], i) => comp(n, i, EX[i][0], EX[i][1], EX[i][2]));
  S.footnote = 'Example for illustration only. IPCW, inverse probability of censoring weights; SGLT2, sodium–glucose cotransporter 2; DPP-4, dipeptidyl peptidase 4.';
  syncInputs(); update();
  RT.toast(T('已載入範例（虛構研究，僅供示範；按 ↶ 可復原）', 'Example loaded (a fictional study, for illustration; ↶ to undo)'));
};
document.getElementById('btnReset').onclick = () => { S.comps = COMPONENTS.map(([n], i) => comp(n, i)); S.footnote = ''; syncInputs(); update(); RT.toast(T('已清空內容（按 ↶ 可復原）', 'Content cleared (↶ to undo)')); };
document.getElementById('btnSaveJson').onclick = () => RT.downloadJSON(S, 'target_trial_table.json');
document.getElementById('btnLoadJson').onclick = async () => { try { S = RT.merge(DEF, await RT.pickJSON()); syncInputs(); update(); } catch (e) { RT.toast(T('讀取失敗：', 'Could not open file: ') + e.message, 6000); } };

syncInputs();
render();
hist.push();
</script>
</body>
</html>
